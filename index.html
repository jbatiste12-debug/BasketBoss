<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BasketBoss — Live Cookbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #14171f; color: #f1f5f9; font-family: system-ui, sans-serif; overflow-x: hidden; }
    .card-shadow { box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5); }
    .glass { background: rgba(20, 23, 31, 0.92); backdrop-filter: blur(12px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    function App() {
      const [tab, setTab] = useState('swipe');
      const [meals, setMeals] = useState([
        { id: '1', name: 'Sheet-Pan Chicken Fajitas', category: 'Mexican • Family', prepTime: 25, estCost: 14.50, image: 'https://www.themealdb.com/images/media/meals/ustsqw1468250014.jpg', familyTip: 'Roast on a single tray and serve with wraps.', method: ['Slice chicken and peppers.', 'Roast at 200°C for 20 mins.', 'Serve in warm wraps.'], ingredients: [{ id: 'i1', name: 'Chicken Breast (1kg)', price: 8.50, category: 'Meat' }, { id: 'i2', name: 'Bell Peppers', price: 2.10, category: 'Vegetables' }, { id: 'i3', name: 'Tortilla Wraps', price: 1.50, category: 'Grains' }] }
      ]);
      const [idx, setIdx] = useState(0);
      
      const [planned, setPlanned] = useState(() => {
        try { return JSON.parse(localStorage.getItem('bb_planned')) || [{ meal: meals[0], assignedDay: 'Monday' }]; } catch(e) { return []; }
      });
      const [pantry, setPantry] = useState(() => {
        try { return JSON.parse(localStorage.getItem('bb_pantry')) || {}; } catch(e) { return {}; }
      });

      useEffect(() => { localStorage.setItem('bb_planned', JSON.stringify(planned)); }, [planned]);
      useEffect(() => { localStorage.setItem('bb_pantry', JSON.stringify(pantry)); }, [pantry]);

      // Fetch live recipes on load
      useEffect(() => {
        async function loadRecipes() {
          try {
            const res = await fetch('https://www.themealdb.com/api/json/v1/1/filter.php?c=Chicken');
            const data = await res.json();
            if (data && data.meals) {
              const live = data.meals.slice(0, 30).map((m, i) => ({
                id: m.idMeal,
                name: m.strMeal,
                category: 'Chicken • Live Cookbook',
                prepTime: 20 + (i % 3) * 5,
                estCost: 12.00 + (i % 5),
                image: m.strMealThumb,
                familyTip: 'Fresh ingredients cooked to perfection.',
                method: ['Prep ingredients.', 'Cook in a pan or tray until tender.', 'Serve warm.'],
                ingredients: [
                  { id: 'ing_' + i + '_1', name: 'Main Protein', price: 7.50, category: 'Meat' },
                  { id: 'ing_' + i + '_2', name: 'Fresh Vegetables', price: 2.50, category: 'Vegetables' },
                  { id: 'ing_' + i + '_3', name: 'Grains & Sauce', price: 2.00, category: 'Grains' }
                ]
              }));
              setMeals(live);
            }
          } catch(e) {}
        }
        loadRecipes();
      }, []);

      const cur = meals[idx] || meals[0];

      const handleLike = (liked) => {
        if (liked && !planned.some(p => p.meal.id === cur.id)) {
          const usedDays = planned.map(p => p.assignedDay);
          const freeDay = DAYS.find(d => !usedDays.includes(d)) || 'Sunday';
          setPlanned([...planned, { meal: cur, assignedDay: freeDay }]);
        }
        setIdx((idx + 1) % meals.length);
      };

      const basket = (() => {
        const map = {};
        planned.forEach(p => p.meal?.ingredients?.forEach(ing => {
          map[ing.id] = ing;
        }));
        return Object.values(map);
      })();

      const totalCost = basket.reduce((sum, i) => pantry[i.id] ? sum : sum + i.price, 0);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 bg-[#14171f]">
          <header className="p-4 glass sticky top-0 z-20 border-b border-slate-800 flex justify-between items-center">
            <h1 className="text-lg font-black text-white">Basket<span className="text-emerald-400">Boss</span></h1>
            <span className="text-sm font-extrabold text-emerald-300 bg-emerald-500/10 px-3 py-1 rounded-xl border border-emerald-500/30">£{totalCost.toFixed(2)}</span>
          </header>

          <main className="p-4 flex-1">
            {tab === 'swipe' && cur && (
              <div className="bg-[#1c202a] border border-slate-700 rounded-3xl overflow-hidden card-shadow">
                <div className="relative h-60">
                  <img src={cur.image} alt={cur.name} className="w-full h-full object-cover" />
                  <span className="absolute top-3 right-3 bg-black/70 px-3 py-1 rounded-full text-xs font-bold text-white">⏱ {cur.prepTime}m</span>
                </div>
                <div className="p-5">
                  <span className="text-[10px] font-black uppercase text-emerald-400">{cur.category}</span>
                  <h2 className="text-xl font-bold text-white mt-1 mb-3">{cur.name}</h2>
                  <p className="text-xs text-slate-300 mb-5 bg-[#14171f] p-3 rounded-2xl">{cur.familyTip}</p>
                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={() => handleLike(false)} className="py-3 bg-[#14171f] text-slate-300 font-bold text-xs rounded-2xl border border-slate-700">✕ Skip</button>
                    <button onClick={() => handleLike(true)} className="py-3 bg-emerald-500 text-slate-950 font-black text-xs rounded-2xl">✓ Add to Week</button>
                  </div>
                </div>
              </div>
            )}

            {tab === 'shop' && (
              <div className="space-y-3">
                <h3 className="text-xs font-black uppercase text-slate-400">Shopping List</h3>
                {basket.map(i => (
                  <div key={i.id} onClick={() => setPantry({...pantry, [i.id]: !pantry[i.id]})} className={`p-3 rounded-xl border flex justify-between cursor-pointer ${pantry[i.id] ? 'opacity-40 line-through bg-slate-900' : 'bg-[#1c202a]'}`}>
                    <span className="text-sm font-semibold text-white">{i.name}</span>
                    <span className="text-sm font-bold text-emerald-300">£{i.price.toFixed(2)}</span>
                  </div>
                ))}
              </div>
            )}

            {tab === 'calendar' && (
              <div className="space-y-3">
                {DAYS.map(day => {
                  const items = planned.filter(p => p.assignedDay === day);
                  return (
                    <div key={day} className="bg-[#1c202a] border border-slate-700 rounded-2xl p-3">
                      <span className="text-xs font-black uppercase text-emerald-400 block mb-2">{day}</span>
                      {items.length > 0 ? items.map(p => (
                        <div key={p.meal.id} className="flex justify-between items-center bg-[#14171f] p-2.5 rounded-xl border border-slate-700">
                          <span className="text-xs font-bold text-white">{p.meal.name}</span>
                          <button onClick={() => setPlanned(planned.filter(x => x.meal.id !== p.meal.id))} className="text-xs text-rose-400">Remove</button>
                        </div>
                      )) : <p className="text-[11px] text-slate-500 italic">No meal assigned.</p>}
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t border-slate-800 grid grid-cols-3 p-2 z-20">
            <button onClick={() => setTab('swipe')} className={`py-2 rounded-xl text-xs font-bold ${tab === 'swipe' ? 'text-emerald-400 bg-[#14171f]' : 'text-slate-400'}`}>🔥 Swipe</button>
            <button onClick={() => setTab('shop')} className={`py-2 rounded-xl text-xs font-bold ${tab === 'shop' ? 'text-emerald-400 bg-[#14171f]' : 'text-slate-400'}`}>🛒 Shop</button>
            <button onClick={() => setTab('calendar')} className={`py-2 rounded-xl text-xs font-bold ${tab === 'calendar' ? 'text-emerald-400 bg-[#14171f]' : 'text-slate-400'}`}>🗓️ Week</button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
