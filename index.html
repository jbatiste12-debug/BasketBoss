  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- REALISTICALLY PRICED INITIAL RECIPES WITH BADGES ---
    const BASE_MEALS = [
      {

        isDateNight: false,
        prepTime: 25,
        estCost: 16.50,
        image: 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80',

      {

        isDateNight: false,

        image: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281298?auto=format&fit=crop&w=800&q=80',

      {

        isDateNight: true,
        prepTime: 20,
        estCost: 18.50,
        image: 'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Pop a quick freezer pizza on for the kids at 5:30 PM, then enjoy this restaurant-quality steak dinner in peace once they are in bed.',
        method: [
          'Take sirloin steaks out of the fridge 20 minutes prior. Pat dry and season generously with salt and black pepper.',
          'Chop Maris Piper potatoes into cubes, toss in olive oil and seasoning, and roast at 200°C for 30 minutes.',
          'Heat a heavy skillet until smoking hot. Add a splash of oil and sear steaks for 3 minutes each side for medium-rare.',
          'Rest steaks for 5 minutes. Warm creamy peppercorn sauce in a pan and serve alongside tenderstem broccoli.'
        ],
        ingredients: [
          { id: 'i17', name: 'Prime Matured Sirloin Steaks (Twin Pack 450g)', price: 11.50, category: 'Meat' },
          { id: 'i18', name: 'Fresh Creamy Peppercorn Sauce Tub', price: 2.50, category: 'Dairy' },
          { id: 'i12', name: 'Tenderstem Broccoli', price: 2.10, category: 'Vegetables' },
          { id: 'i13', name: 'Maris Piper Potatoes (2.5kg bag)', price: 2.40, category: 'Vegetables' }
        ]
      }
    ];

    // --- INFINITE AI GENERATION POOL WITH BADGES ---
    const AI_GENERATION_POOL = [
      {
        name: 'One-Pan Sausage & Gnocchi Tomato Bake',
        category: 'Midweek Comfort • Family of 6',
        styleTag: 'ONE-PAN WONDER',
        styleTagColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        isDateNight: false,
        prepTime: 20,
        estCost: 12.50,
        image: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281298?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Soft potato gnocchi cooks directly in the tomato sauce alongside sliced pork sausages. Incredible texture kids adore.',
        method: [
          'Brown sliced Cumberland sausages in a large frying pan until golden.',
          'Add a carton of passata, garlic powder, Italian herbs, and uncooked potato gnocchi straight into the pan.',
          'Simmer covered for 10 minutes until gnocchi is pillow-soft.',
          'Top with mozzarella cheese and grill for 3 minutes until bubbly and golden.'
        ],
        ingredients: [
          { id: 'ai_i1', name: 'Cumberland Pork Sausages (6-pack)', price: 3.50, category: 'Meat' },
          { id: 'ai_i2', name: 'Potato Gnocchi Pack (500g)', price: 1.80, category: 'Grains' },
          { id: 'ai_i3', name: 'Passata with Basil (500g)', price: 1.30, category: 'Vegetables' },
          { id: 'ai_i4', name: 'Mozzarella Grating Ball', price: 2.40, category: 'Dairy' }
        ]
      },
      {
        name: 'Sheet-Pan Honey Mustard Chicken & Veggies',
        category: 'Healthy Traybake • Family of 6',
        styleTag: 'TRAYBAKE & ROAST',
        styleTagColor: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        isDateNight: false,
        prepTime: 25,
        estCost: 13.80,
        image: 'https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Chop everything onto one roasting tray, drizzle with honey and mustard, and let the oven do 100% of the work.',
        method: [
          'Preheat oven to 200°C. Chop chicken thighs, new potatoes, and carrots into bite-sized pieces.',
          'Whisk honey, whole grain mustard, olive oil, and a splash of soy sauce together.',
          'Toss everything together on a large baking sheet and roast for 35 minutes until caramelised.'
        ],
        ingredients: [
          { id: 'ai_i5', name: 'Chicken Thighs Bone-In (1kg)', price: 6.50, category: 'Meat' },
          { id: 'ai_i6', name: 'Baby New Potatoes (1kg bag)', price: 2.10, category: 'Vegetables' },
          { id: 'ai_i7', name: 'Carrots & Honey Bottle', price: 3.20, category: 'Vegetables' }
        ]
      },
      {
        name: 'Creamy Tuscan Butter Garlic Salmon',
        category: '✨ Date Night Idea • For Two',
        styleTag: 'DATE NIGHT SPECIAL',
        styleTagColor: 'bg-rose-500/20 text-rose-300 border-rose-500/40',
        isDateNight: true,
        prepTime: 20,
        estCost: 17.80,
        image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Pan-sear salmon and simmer in a sun-dried tomato and garlic cream reduction.',
        method: [
          'Season salmon fillets with salt, pepper, and garlic powder. Sear skin-side down in olive oil for 4 minutes.',
          'Flip salmon and add minced garlic, halved cherry tomatoes, and sliced sun-dried tomatoes to the pan.',
          'Pour in double cream and let simmer gently for 5 minutes until sauce thickens.',
          'Serve hot over sautéed asparagus.'
        ],
        ingredients: [
          { id: 'ai_i8', name: 'Fresh Salmon Fillets (Twin Pack)', price: 9.50, category: 'Meat' },
          { id: 'ai_i9', name: 'Double Cream & Sun-Dried Tomatoes', price: 4.20, category: 'Dairy' },
          { id: 'ai_i10', name: 'Fresh Asparagus', price: 4.10, category: 'Vegetables' }
        ]
      },
      {
        name: 'One-Pan Crispy Bacon & Cheese Quesadillas',
        category: 'Quick Kid-Pleaser • Family of 6',
        styleTag: 'KID-APPROVED FAVORITE',
        styleTagColor: 'bg-teal-500/20 text-teal-300 border-teal-500/40',
        isDateNight: false,
        prepTime: 15,
        estCost: 10.50,
        image: 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Kids go crazy for these. Crisp up bacon, fold with loads of melted cheddar inside tortillas, and toast in a dry frying pan until golden.',
        method: [
          'Fry smoked bacon medallions in a pan until crispy, then chop into bits.',
          'Place tortilla wrap in pan, add grated cheese and bacon, fold in half and toast both sides until crispy.',
          'Slice into triangles and serve with sweetcorn and sour cream.'
        ],
        ingredients: [
          { id: 'ai_i11', name: 'Smoked Bacon Medallions (2x packs)', price: 5.00, category: 'Meat' },
          { id: 'ai_i12', name: 'Tortilla Wraps (8-pack)', price: 1.50, category: 'Grains' },
          { id: 'ai_i13', name: 'Mature Cheddar Block (400g)', price: 3.90, category: 'Dairy' }
        ]
      }
    ];

    const DAYS_LIST = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    function getWeekDays() {
      const today = new Date();
      const day = today.getDay();
      const diffToMonday = today.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(today.setDate(diffToMonday));

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dayName = DAYS_LIST[i];
        const dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        days.push({ dayName, dateStr });
      }
      return days;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('swipe');
      const [meals, setMeals] = useState(BASE_MEALS);
      const [deckIndex, setDeckIndex] = useState(0);
      const [plannedMeals, setPlannedMeals] = useState([
        { meal: BASE_MEALS[0], assignedDay: 'Monday' },
        { meal: BASE_MEALS[1], assignedDay: 'Tuesday' },
        { meal: BASE_MEALS[3], assignedDay: 'Friday' }
      ]);
      const [pantryChecked, setPantryChecked] = useState({});
      const [scanMessage, setScanMessage] = useState('');
      const [isAutoGenerating, setIsAutoGenerating] = useState(false);
      const [expandedMethodId, setExpandedMethodId] = useState(null);
      const [dragX, setDragX] = useState(0);
      const startXRef = useRef(null);

      const currentMeal = meals[deckIndex];
      const weekDays = getWeekDays();

      useEffect(() => {
        if (deckIndex >= meals.length - 2 && !isAutoGenerating) {
          setIsAutoGenerating(true);
          setTimeout(() => {
            const randomTemplate = AI_GENERATION_POOL[Math.floor(Math.random() * AI_GENERATION_POOL.length)];
            const uniqueId = 'auto_ai_' + Date.now() + Math.floor(Math.random() * 1000);
            const newAutoRecipe = {
              ...randomTemplate,
              id: uniqueId,
              name: randomTemplate.name + ' (AI Curated)'
            };
            setMeals(prev => [...prev, newAutoRecipe]);
            setIsAutoGenerating(false);
          }, 400);
        }
      }, [deckIndex, meals.length, isAutoGenerating]);

      const consolidatedBasket = () => {
        const map = {};
        plannedMeals.forEach(item => {
          item.meal.ingredients.forEach(ing => {
            if (!map[ing.id]) {
              map[ing.id] = { ...ing, usedInCount: 1, meals: [item.meal.name] };
            } else {
              map[ing.id].usedInCount += 1;
              map[ing.id].meals.push(item.meal.name);
            }
          });
        });
        return Object.values(map);
      };

      const basketItems = consolidatedBasket();
      const totalBasketCost = basketItems.reduce((sum, item) => {
        return pantryChecked[item.id] ? sum : sum + item.price;
      }, 0);

      const savedBySharingPacks = basketItems.reduce((sum, item) => {
        return item.usedInCount > 1 ? sum + item.price * (item.usedInCount - 1) : sum;
      }, 0);

      const categoriesOrder = ['Meat', 'Vegetables', 'Dairy', 'Grains', 'Bakery'];
      const categoryLabels = {
        Meat: '🥩 Meat & Fish',
        Vegetables: '🥦 Vegetables & Produce',
        Dairy: '🥛 Dairy',
        Grains: '🌾 Grains & Dry Goods',
        Bakery: '🍞 Bakery'
      };

      const groupedBasket = basketItems.reduce((acc, item) => {
        const cat = item.category || 'Grains';
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(item);
        return acc;
      }, {});

      const handleDecision = (liked) => {
        if (!currentMeal) return;
        if (liked) {
          if (!plannedMeals.find(pm => pm.meal.id === currentMeal.id)) {
            const assignedDays = plannedMeals.map(pm => pm.assignedDay);
            const availableDay = DAYS_LIST.find(d => !assignedDays.includes(d)) || 'Saturday';
            setPlannedMeals([...plannedMeals, { meal: currentMeal, assignedDay: availableDay }]);
          }
        }
        setDragX(0);
        setDeckIndex(prev => prev + 1);
      };

      const removePlannedMeal = (mealId) => {
        setPlannedMeals(plannedMeals.filter(pm => pm.meal.id !== mealId));
      };

      const updateAssignedDay = (mealId, newDay) => {
        setPlannedMeals(plannedMeals.map(pm => {
          if (pm.meal.id === mealId) {
            return { ...pm, assignedDay: newDay };
          }
          return pm;
        }));
      };

      const togglePantryItem = (id) => {
        setPantryChecked(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setPantryChecked(prev => ({ ...prev, i1: true, i5: true, i13: true }));
        setScanMessage(`Scanned "${file.name}" — ticked off detected items from your basket!`);
      };

      const onTouchStart = (e) => { startXRef.current = e.touches[0].clientX; };
      const onTouchMove = (e) => {
        if (startXRef.current === null) return;
        setDragX(e.touches[0].clientX - startXRef.current);
      };
      const onTouchEnd = () => {
        if (dragX > 90) handleDecision(true);
        else if (dragX < -90) handleDecision(false);
        else setDragX(0);
        startXRef.current = null;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 bg-[#14171f]">
          {/* HEADER */}
          <header className="p-4 glass-header sticky top-0 z-20 border-b border-slate-800/80 flex justify-between items-center shadow-lg">
            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-rose-500/20 border border-emerald-500/40 flex items-center justify-center shadow-inner relative overflow-hidden">
                <svg className="w-6 h-6 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M2 7l4 3 6-5 6 5 4-3v2H2V7z" fill="currentColor" fillOpacity="0.15" stroke="currentColor" />
                  <path d="M3 9h18l-2 11H5L3 9z" />
                  <path d="M9 14l3 3 3-3" stroke="#f43f5e" strokeWidth="2" />
                </svg>
              </div>
              <div>
                <h1 className="text-lg font-black tracking-tight text-white flex items-center gap-1 leading-none">
                  Basket<span className="text-emerald-400">Boss</span>
                </h1>
                <p className="text-[11px] text-slate-400 font-medium mt-0.5">
                  {plannedMeals.length} Meals Locked
                </p>
              </div>
            </div>
            
            <div className="bg-emerald-500/10 border border-emerald-500/30 px-3.5 py-1.5 rounded-xl text-right shadow-inner">
              <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-bold">Est. Shop</span>
              <span className="text-lg font-extrabold text-emerald-300">£{totalBasketCost.toFixed(2)}</span>
            </div>
          </header>

          {/* MAIN */}
          <main className="p-4 flex-1">
            {/* TAB 1: SWIPE DECK */}
            {activeTab === 'swipe' && (
              currentMeal ? (
                <div>
                  <div
                    onTouchStart={onTouchStart}
                    onTouchMove={onTouchMove}
                    onTouchEnd={onTouchEnd}
                    style={{
                      transform: `translateX(${dragX}px) rotate(${dragX * 0.04}deg)`,
                      transition: startXRef.current ? 'none' : 'transform 0.25s ease'
                    }}
                    className={`rounded-3xl overflow-hidden card-shadow no-select border transition-all ${
                      currentMeal.isDateNight
                        ? 'bg-gradient-to-b from-[#251522] to-[#1c1f28] border-rose-500/40'
                        : 'bg-[#1c202a] border-slate-700/80'
                    }`}
                  >
                    <div className="relative h-60">
                      <img src={currentMeal.image} alt={currentMeal.name} className="w-full h-full object-cover" />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#1c202a] via-transparent to-black/30"></div>
                      
                      {/* STYLE & QUICK BADGE */}
                      <div className="absolute top-3 left-3 flex flex-wrap gap-2">
                        {currentMeal.isDateNight ? (
                          <div className="bg-rose-600 text-white px-3.5 py-1 rounded-full text-xs font-black shadow-lg uppercase tracking-wide">
                            🥂 Date Night Idea
                          </div>
                        ) : (
                          <div className={`px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider border shadow-lg ${currentMeal.styleTagColor || 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'}`}>
                            {currentMeal.styleTag || 'FAMILY FAVORITE'}
                          </div>
                        )}
                      </div>

                      {!currentMeal.isDateNight && (
                        <div className="absolute bottom-3 left-3 bg-[#14171f]/85 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-emerald-300 border border-emerald-500/30">
                          £{currentMeal.estCost.toFixed(2)} meal est.
                        </div>
                      )}
                      <div className="absolute top-3 right-3 bg-[#14171f]/85 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-slate-200 border border-slate-700">
                        ⏱ {currentMeal.prepTime} mins
                      </div>
                    </div>

                    <div className="p-5">
                      <span className={`text-[11px] font-black uppercase tracking-wider ${
                        currentMeal.isDateNight ? 'text-rose-400' : 'text-emerald-400'
                      }`}>
                        {currentMeal.category}
                      </span>
                      <h2 className="text-xl font-bold text-white mt-1 mb-3 leading-snug">{currentMeal.name}</h2>

                      <div className={`rounded-2xl p-3.5 mb-5 border ${
                        currentMeal.isDateNight
                          ? 'bg-rose-950/30 border-rose-800/40 text-rose-100'
                          : 'bg-[#14171f]/70 border-slate-700/80 text-slate-200'
                      }`}>
                        <div className="text-xs font-bold text-amber-300 mb-1 flex items-center gap-1.5">
                          <span>{currentMeal.isDateNight ? '🕯️' : '👨‍👩‍👧‍👦'}</span>
                          <span>{currentMeal.isDateNight ? 'Date Night Plan' : 'Kitchen Time-Saver'}</span>
                        </div>
                        <p className="text-xs leading-relaxed opacity-90">{currentMeal.familyTip}</p>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <button
                          onClick={() => handleDecision(false)}
                          className="py-3.5 rounded-2xl bg-[#14171f] hover:bg-[#222734] active:scale-95 text-slate-300 font-bold text-xs uppercase tracking-wider border border-slate-700 transition shadow"
                        >
                          ✕ Discard (No)
                        </button>
                        <button
                          onClick={() => handleDecision(true)}
                          className={`py-3.5 rounded-2xl font-extrabold text-xs uppercase tracking-wider active:scale-95 transition shadow-lg ${
                            currentMeal.isDateNight
                              ? 'bg-rose-600 hover:bg-rose-500 text-white'
                              : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                          }`}
                        >
                          ✓ Add to Week (Yes)
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-col items-center mt-4 px-1">
                    <p className="text-[11px] text-slate-400 text-center font-medium bg-[#1c202a] px-4 py-2 rounded-xl border border-slate-800 shadow-inner w-full">
                      💡 <span className="text-emerald-400 font-bold">Swipe Right / Add to Week</span> = Yes | <span className="text-rose-400 font-bold">Swipe Left / Discard</span> = No
                    </p>
                    {isAutoGenerating && (
                      <span className="text-xs text-indigo-400 font-bold animate-pulse mt-2">✨ AI inventing next recipe...</span>
                    )}
                  </div>
                </div>
              ) : null
            )}

            {/* TAB 2: SCANNER */}
            {activeTab === 'scan' && (
              <div className="space-y-4">
                <div className="bg-[#1c202a] border border-slate-700/80 rounded-3xl p-6 text-center card-shadow">
                  <div className="text-5xl mb-3">📸</div>
                  <h2 className="text-base font-black text-white">AI Fridge & Pantry Scanner</h2>
                  <p className="text-xs text-slate-400 mt-1 mb-5 leading-relaxed">
                    Snap a photo of your fridge shelves to automatically tick off packs you already own and deduct them from your shop total.
                  </p>

                  <label className="block w-full py-4 px-4 bg-emerald-500 hover:bg-emerald-400 active:scale-98 text-slate-950 font-black text-xs uppercase tracking-wider rounded-2xl cursor-pointer transition shadow-lg">
                    📷 Take or Upload Fridge Photo
                    <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                  </label>
                </div>

                {scanMessage && (
                  <div className="bg-emerald-950/80 border border-emerald-500/50 rounded-2xl p-4 text-xs text-emerald-200 font-bold card-shadow">
                    ✅ {scanMessage}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: SHOP */}
            {activeTab === 'shop' && (
              <div className="space-y-5">
                <div className="bg-emerald-950/40 border border-emerald-700/50 rounded-2xl p-4 flex justify-between items-center card-shadow">
                  <div>
                    <h3 className="text-xs font-black uppercase tracking-wider text-emerald-300">Smart Pack Sharing</h3>
                    <p className="text-xs text-slate-300 mt-0.5">Overlapping ingredients combined into single packs</p>
                  </div>
                  <span className="text-sm font-black text-emerald-300 bg-emerald-900/60 px-3.5 py-1 rounded-xl border border-emerald-600/40">
                    Saved £{savedBySharingPacks.toFixed(2)}
                  </span>
                </div>

                <div>
                  <h3 className="text-xs font-black uppercase tracking-wider text-slate-400 mb-2">This Week's Menu ({plannedMeals.length})</h3>
                  <div className="space-y-2">
                    {plannedMeals.map(pm => (
                      <div key={pm.meal.id} className="flex justify-between items-center bg-[#1c202a] border border-slate-700/80 px-3.5 py-3 rounded-2xl card-shadow">
                        <div>
                          <span className="text-sm font-bold text-white block">
                            {pm.meal.isDateNight ? '🥂 ' : '🍽️ '}{pm.meal.name}
                          </span>
                          <span className="text-[11px] text-emerald-400 font-semibold">Assigned to: {pm.assignedDay}</span>
                        </div>
                        <button
                          onClick={() => removePlannedMeal(pm.meal.id)}
                          className="text-xs text-rose-400 hover:text-rose-300 font-bold px-2.5 py-1 rounded-lg bg-rose-500/10 border border-rose-500/20 transition"
                        >
                          Remove
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-xs font-black uppercase tracking-wider text-slate-400">
                    Categorized Shopping List (Tap if already in kitchen)
                  </h3>

                  {categoriesOrder.map(catKey => {
                    const itemsInCat = groupedBasket[catKey];
                    if (!itemsInCat || itemsInCat.length === 0) return null;

                    return (
                      <div key={catKey} className="bg-[#1c202a] border border-slate-700/80 rounded-2xl p-3.5 card-shadow space-y-2">
                        <h4 className="text-xs font-black uppercase tracking-wider text-emerald-400 px-1">
                          {categoryLabels[catKey]}
                        </h4>
                        <div className="space-y-2">
                          {itemsInCat.map(item => {
                            const checked = !!pantryChecked[item.id];
                            return (
                              <div
                                key={item.id}
                                onClick={() => togglePantryItem(item.id)}
                                className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${
                                  checked
                                    ? 'bg-[#14171f]/50 border-slate-800 opacity-40 line-through'
                                    : 'bg-[#14171f] border-slate-700/80 hover:border-slate-600'
                                }`}
                              >
                                <div>
                                  <span className="text-sm font-semibold text-white">{item.name}</span>
                                  {item.usedInCount > 1 && (
                                    <div className="mt-1">
                                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-md font-bold border border-emerald-500/30">
                                        Shared across {item.usedInCount} meals
                                      </span>
                                    </div>
                                  )}
                                </div>
                                <span className="text-sm font-extrabold text-emerald-300">£{item.price.toFixed(2)}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: CALENDAR */}
            {activeTab === 'calendar' && (
              <div className="space-y-4">
                <div className="bg-[#1c202a] border border-slate-700/80 rounded-2xl p-4 card-shadow flex items-center justify-between">
                  <div>
                    <h2 className="text-xs font-black uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                      <span>🗓️</span> Interactive Weekly Schedule
                    </h2>
                    <p className="text-xs text-slate-300 mt-0.5">Use the dropdown on any meal to instantly reschedule days.</p>
                  </div>
                  <div className="bg-[#14171f] border border-slate-700 px-3 py-1.5 rounded-xl text-center">
                    <span className="text-[10px] text-slate-400 block font-bold uppercase">Planned</span>
                    <span className="text-sm font-black text-emerald-300">{plannedMeals.length} Meals</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {weekDays.map((wd) => {
                    const assignedMealsForDay = plannedMeals.filter(pm => pm.assignedDay === wd.dayName);

                    return (
                      <div
                        key={wd.dayName}
                        className="rounded-2xl border card-shadow overflow-hidden bg-[#1c202a] border-slate-700/80"
                      >
                        <div className="px-4 py-2.5 bg-[#14171f]/80 border-b border-slate-700/60 flex justify-between items-center">
                          <div className="flex items-center gap-2">
                            <div className="w-7 h-7 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xs">
                              {wd.dateStr.split(' ')[0]}
                            </div>
                            <div>
                              <h3 className="text-xs font-black uppercase tracking-wider text-white">{wd.dayName}</h3>
                              <span className="text-[10px] text-slate-400 font-medium">{wd.dateStr}</span>
                            </div>
                          </div>
                          <span className="text-[10px] font-bold text-slate-400">
                            {assignedMealsForDay.length > 0 ? '1 Meal Assigned' : 'Rest / Free Night'}
                          </span>
                        </div>

                        <div className="p-3.5 space-y-3">
                          {assignedMealsForDay.length > 0 ? (
                            assignedMealsForDay.map((pm) => {
                              const meal = pm.meal;
                              const isDate = meal.isDateNight;
                              const isMethodOpen = expandedMethodId === `${wd.dayName}-${meal.id}`;

                              return (
                                <div key={meal.id} className={`p-3.5 rounded-xl border ${isDate ? 'bg-gradient-to-r from-[#251522] to-[#1c1f28] border-rose-800/50' : 'bg-[#14171f] border-slate-700'}`}>
                                  <div className="flex justify-between items-start mb-2">
                                    <div>
                                      <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider inline-block mb-1 ${
                                        isDate ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20'
                                      }`}>
                                        {isDate ? '🥂 Date Night' : (meal.styleTag || '🍽️ Family Dinner')}
                                      </span>
                                      <h4 className="text-sm font-bold text-white leading-snug">{meal.name}</h4>
                                    </div>
                                    <button
                                      onClick={() => removePlannedMeal(meal.id)}
                                      className="text-xs text-rose-400 hover:text-rose-300 font-bold px-2 py-1 rounded bg-rose-500/10 border border-rose-500/20 transition"
                                    >
                                      ✕
                                    </button>
                                  </div>

                                  <div className="flex justify-between items-center text-xs text-slate-400 mb-3">
                                    <span>⏱ {meal.prepTime}m prep</span>
                                    <span className="font-bold text-emerald-400">£{meal.estCost.toFixed(2)}</span>
                                  </div>

                                  <div className="flex items-center gap-2 mb-3 bg-[#1c202a] p-2 rounded-xl border border-slate-700">
                                    <span className="text-[11px] font-bold text-slate-300 whitespace-nowrap">📅 Move Day:</span>
                                    <select
                                      value={pm.assignedDay}
                                      onChange={(e) => updateAssignedDay(meal.id, e.target.value)}
                                      className="w-full bg-[#14171f] text-emerald-300 text-xs font-bold py-1 px-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500"
                                    >
                                      {DAYS_LIST.map(d => (
                                        <option key={d} value={d}>{d}</option>
                                      ))}
                                    </select>
                                  </div>

                                  <button
                                    onClick={() => setExpandedMethodId(isMethodOpen ? null : `${wd.dayName}-${meal.id}`)}
                                    className="w-full py-2 bg-[#1c202a] hover:bg-[#252a36] text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition flex justify-center items-center gap-1.5 shadow"
                                  >
                                    <span>{isMethodOpen ? 'Hide Cooking Method ▴' : 'View Step-by-Step Method ▾'}</span>
                                  </button>

                                  {isMethodOpen && (
                                    <div className="mt-3 pt-3 border-t border-slate-700/80 space-y-2 animate-fadeIn">
                                      <h5 className="text-[11px] font-black uppercase tracking-wider text-amber-300">👨‍🍳 Step-by-Step Method:</h5>
                                      <ol className="list-decimal list-inside space-y-1.5 text-xs text-slate-200 leading-relaxed">
                                        {meal.method?.map((step, sIdx) => (
                                          <li key={sIdx} className="pl-1">{step}</li>
                                        ))}
                                      </ol>
                                      <div className="mt-2.5 bg-[#14171f] p-3 rounded-xl border border-slate-700">
                                        <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400 block mb-0.5">💡 Kitchen Tip:</span>
                                        <p className="text-[11px] text-slate-300 leading-relaxed">{meal.familyTip}</p>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            })
                          ) : (
                            <p className="text-xs text-slate-500 italic py-1">No meal scheduled for this day. (Swipe right on meals to add them here)</p>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-header border-t border-slate-800/80 grid grid-cols-4 p-2 z-20 shadow-2xl">
            <button
              onClick={() => setActiveTab('swipe')}
              className={`py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition ${
                activeTab === 'swipe' ? 'text-emerald-400 bg-[#14171f] shadow-inner border border-slate-800' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              🔥 Swipe
            </button>
            <button
              onClick={() => setActiveTab('scan')}
              className={`py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition ${
                activeTab === 'scan' ? 'text-emerald-400 bg-[#14171f] shadow-inner border border-slate-800' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              📸 Scan
            </button>
            <button
              onClick={() => setActiveTab('shop')}
              className={`py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition ${
                activeTab === 'shop' ? 'text-emerald-400 bg-[#14171f] shadow-inner border border-slate-800' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              🛒 Shop
            </button>
            <button
              onClick={() => setActiveTab('calendar')}
              className={`py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition ${
                activeTab === 'calendar' ? 'text-emerald-400 bg-[#14171f] shadow-inner border border-slate-800' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              🗓️ Week
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
