<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BasketBoss — Fully Automated AI Meal Planner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- INITIAL SEED RECIPES ---
    const BASE_MEALS = [
      {
        id: 'm1',
        name: 'Sheet-Pan Chicken Fajitas & Loaded Nachos',
        category: 'Mexican • Family of 6',
        isDateNight: false,
        prepTime: 25,
        estCost: 13.50,
        image: 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Roast chicken and peppers on one big tray. Put wraps, cheddar, and sour cream in the middle of the table so kids build their own.',
        ingredients: [
          { id: 'i1', name: 'Chicken Breast Fillets (1kg pack)', price: 7.00, aisle: 'Meat & Fish' },
          { id: 'i2', name: 'Mixed Bell Peppers (3-pack)', price: 1.80, aisle: 'Produce' },
          { id: 'i3', name: 'Tortilla Wraps (8-pack)', price: 1.50, aisle: 'Bakery' },
          { id: 'i4', name: 'Soured Cream & Chive Dip', price: 1.60, aisle: 'Dairy' },
          { id: 'i5', name: 'Mature Cheddar Block (400g)', price: 3.20, aisle: 'Dairy' }
        ]
      },
      {
        id: 'm2',
        name: 'Slow-Simmered Beef Bolognese & Garlic Bread',
        category: 'Italian • Crowd Pleaser',
        isDateNight: false,
        prepTime: 30,
        estCost: 11.90,
        image: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281298?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Finely grate courgettes and carrots straight into the mince—they melt into the tomato sauce so the kids never spot them.',
        ingredients: [
          { id: 'i6', name: 'Beef Mince (750g family pack)', price: 5.80, aisle: 'Meat & Fish' },
          { id: 'i7', name: 'Penne Pasta (1kg)', price: 1.50, aisle: 'Tins & Dry' },
          { id: 'i8', name: 'Chopped Tomatoes (4-pack tins)', price: 2.40, aisle: 'Tins & Dry' },
          { id: 'i9', name: 'Carrots & Courgettes Pack', price: 1.70, aisle: 'Produce' },
          { id: 'i10', name: 'Garlic Baguette (Twin Pack)', price: 1.80, aisle: 'Bakery' }
        ]
      },
      {
        id: 'd1',
        name: 'Pan-Seared Sirloin Steaks & Peppercorn Sauce',
        category: '✨ Date Night Idea • For Two',
        isDateNight: true,
        prepTime: 20,
        estCost: 14.50,
        image: 'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Pop a quick freezer pizza on for the kids at 5:30 PM, then enjoy this restaurant-quality steak dinner in peace once they are in bed.',
        ingredients: [
          { id: 'i17', name: '2x Matured Sirloin Steaks (450g)', price: 10.50, aisle: 'Meat & Fish' },
          { id: 'i18', name: 'Fresh Creamy Peppercorn Sauce Tub', price: 2.20, aisle: 'Dairy' },
          { id: 'i12', name: 'Tenderstem Broccoli', price: 1.80, aisle: 'Produce' },
          { id: 'i13', name: 'Maris Piper Potatoes (2.5kg bag)', price: 2.20, aisle: 'Produce' }
        ]
      }
    ];

    // --- INFINITE AI GENERATION POOL ---
    const AI_GENERATION_POOL = [
      {
        name: 'Crispy Southern Fried Chicken Burgers & Slaw',
        category: 'Fakeaway Night • Family of 6',
        isDateNight: false,
        prepTime: 25,
        estCost: 12.20,
        image: 'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Coat chicken in crushed cornflakes for an incredible crunch without deep frying.',
        ingredients: [
          { id: 'ai_i1', name: 'Chicken Breast Fillets (1kg)', price: 7.00, aisle: 'Meat & Fish' },
          { id: 'ai_i2', name: 'Brioche Buns (6-pack)', price: 1.90, aisle: 'Bakery' },
          { id: 'ai_i3', name: 'Coleslaw Kit & Salad', price: 3.30, aisle: 'Produce' }
        ]
      },
      {
        name: 'Loaded Greek Chicken Souvlaki & Flatbreads',
        category: 'Mediterranean • Family of 6',
        isDateNight: false,
        prepTime: 30,
        estCost: 13.00,
        image: 'https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Marinate chicken in oregano, lemon, and garlic. Serve with tzatziki and cucumber sticks.',
        ingredients: [
          { id: 'ai_i1', name: 'Chicken Breast Fillets (1kg)', price: 7.00, aisle: 'Meat & Fish' },
          { id: 'ai_i4', name: 'Greek Flatbreads (6-pack)', price: 1.80, aisle: 'Bakery' },
          { id: 'ai_i5', name: 'Tzatziki & Cucumbers', price: 4.20, aisle: 'Produce' }
        ]
      },
      {
        name: 'Creamy Tuscan Butter Garlic Salmon',
        category: '✨ Date Night Idea • For Two',
        isDateNight: true,
        prepTime: 20,
        estCost: 14.20,
        image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Pan-sear salmon and simmer in a sun-dried tomato and garlic cream reduction.',
        ingredients: [
          { id: 'ai_i6', name: 'Salmon Fillets (Twin Pack)', price: 7.50, aisle: 'Meat & Fish' },
          { id: 'ai_i7', name: 'Double Cream & Sun-Dried Tomatoes', price: 3.50, aisle: 'Dairy' },
          { id: 'ai_i8', name: 'Fresh Asparagus', price: 3.20, aisle: 'Produce' }
        ]
      },
      {
        name: 'Smoky Beef & Three Bean Chilli Bowl',
        category: 'Batch Cook • Family of 6',
        isDateNight: false,
        prepTime: 25,
        estCost: 11.50,
        image: 'https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Batch cook this hearty chilli; leftovers taste even better the next day wrapped in burritos.',
        ingredients: [
          { id: 'ai_i9', name: 'Beef Mince (750g)', price: 5.80, aisle: 'Meat & Fish' },
          { id: 'ai_i10', name: 'Mixed Beans & Chopped Tomatoes', price: 3.00, aisle: 'Tins & Dry' },
          { id: 'ai_i11', name: 'Long Grain Rice (1kg)', price: 2.70, aisle: 'Tins & Dry' }
        ]
      },
      {
        name: 'Truffled Wild Mushroom & Spinach Tagliatelle',
        category: '✨ Date Night Idea • For Two',
        isDateNight: true,
        prepTime: 25,
        estCost: 12.80,
        image: 'https://images.unsplash.com/photo-1563379926898-05f4575a45d8?auto=format&fit=crop&w=800&q=80',
        familyTip: 'Earthy mushrooms tossed in garlic butter, parmesan, and fresh ribbon tagliatelle.',
        ingredients: [
          { id: 'ai_i12', name: 'Fresh Tagliatelle Pasta', price: 2.50, aisle: 'Tins & Dry' },
          { id: 'ai_i13', name: 'Wild Mushrooms & Spinach', price: 4.80, aisle: 'Produce' },
          { id: 'ai_i14', name: 'Parmesan Block', price: 5.50, aisle: 'Dairy' }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('swipe');
      const [meals, setMeals] = useState(BASE_MEALS);
      const [deckIndex, setDeckIndex] = useState(0);
      const [plannedMeals, setPlannedMeals] = useState([BASE_MEALS[0], BASE_MEALS[2]]);
      const [pantryChecked, setPantryChecked] = useState({});
      const [scanMessage, setScanMessage] = useState('');
      const [isAutoGenerating, setIsAutoGenerating] = useState(false);
      const [dragX, setDragX] = useState(0);
      const startXRef = useRef(null);

      const currentMeal = meals[deckIndex];

      // --- AUTOMATIC BACKGROUND AI GENERATOR ---
      // Whenever you get within 2 cards of the end of the deck, automatically invent new recipes!
      useEffect(() => {
        if (deckIndex >= meals.length - 2 && !isAutoGenerating) {
          setIsAutoGenerating(true);
          setTimeout(() => {
            const randomTemplate = AI_GENERATION_POOL[Math.floor(Math.random() * AI_GENERATION_POOL.length)];
            const uniqueId = 'auto_ai_' + Date.now() + Math.floor(Math.random() * 1000);
            const newAutoRecipe = {
              ...randomTemplate,
              id: uniqueId,
              name: randomTemplate.name + ' (AI Curated)'
            };
            setMeals(prev => [...prev, newAutoRecipe]);
            setIsAutoGenerating(false);
          }, 400);
        }
      }, [deckIndex, meals.length, isAutoGenerating]);

      // --- SMART PACK CONSOLIDATION ---
      const consolidatedBasket = () => {
        const map = {};
        plannedMeals.forEach(meal => {
          meal.ingredients.forEach(ing => {
            if (!map[ing.id]) {
              map[ing.id] = { ...ing, usedInCount: 1, meals: [meal.name] };
            } else {
              map[ing.id].usedInCount += 1;
              map[ing.id].meals.push(meal.name);
            }
          });
        });
        return Object.values(map);
      };

      const basketItems = consolidatedBasket();
      const totalBasketCost = basketItems.reduce((sum, item) => {
        return pantryChecked[item.id] ? sum : sum + item.price;
      }, 0);

      const savedBySharingPacks = basketItems.reduce((sum, item) => {
        return item.usedInCount > 1 ? sum + item.price * (item.usedInCount - 1) : sum;
      }, 0);

      // --- SWIPE HANDLERS ---
      const handleDecision = (liked) => {
        if (!currentMeal) return;
        if (liked && !plannedMeals.find(m => m.id === currentMeal.id)) {
          setPlannedMeals([...plannedMeals, currentMeal]);
        }
        setDragX(0);
        setDeckIndex(prev => prev + 1);
      };

      const togglePantryItem = (id) => {
        setPantryChecked(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setPantryChecked(prev => ({ ...prev, i1: true, i5: true, i13: true }));
        setScanMessage(`Scanned "${file.name}" — ticked off detected items from your basket!`);
      };

      const onTouchStart = (e) => { startXRef.current = e.touches[0].clientX; };
      const onTouchMove = (e) => {
        if (startXRef.current === null) return;
        setDragX(e.touches[0].clientX - startXRef.current);
      };
      const onTouchEnd = () => {
        if (dragX > 90) handleDecision(true);
        else if (dragX < -90) handleDecision(false);
        else setDragX(0);
        startXRef.current = null;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24">
          {/* TOP HEADER */}
          <header className="p-4 bg-slate-900/95 backdrop-blur sticky top-0 z-20 border-b border-slate-800 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                🛒 BasketBoss
              </h1>
              <p className="text-xs text-slate-400">
                {plannedMeals.filter(m => !m.isDateNight).length} Family + {plannedMeals.filter(m => m.isDateNight).length} Date Night
              </p>
            </div>
            <div className="bg-emerald-500/10 border border-emerald-500/30 px-3.5 py-1.5 rounded-xl text-right">
              <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-semibold">Est. Shop</span>
              <span className="text-lg font-bold text-emerald-300">£{totalBasketCost.toFixed(2)}</span>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="p-4 flex-1">
            {/* TAB 1: SWIPE DECK */}
            {activeTab === 'swipe' && (
              currentMeal ? (
                <div>
                  <div
                    onTouchStart={onTouchStart}
                    onTouchMove={onTouchMove}
                    onTouchEnd={onTouchEnd}
                    style={{
                      transform: `translateX(${dragX}px) rotate(${dragX * 0.04}deg)`,
                      transition: startXRef.current ? 'none' : 'transform 0.25s ease'
                    }}
                    className={`rounded-3xl overflow-hidden shadow-2xl no-select border ${
                      currentMeal.isDateNight
                        ? 'bg-gradient-to-b from-rose-950/80 to-slate-900 border-rose-500/50'
                        : 'bg-slate-800 border-slate-700'
                    }`}
                  >
                    <div className="relative h-60">
                      <img src={currentMeal.image} alt={currentMeal.name} className="w-full h-full object-cover" />
                      {currentMeal.isDateNight && (
                        <div className="absolute top-3 left-3 bg-rose-600 text-white px-3 py-1 rounded-full text-xs font-extrabold shadow-lg">
                          🥂 DATE NIGHT IDEA
                        </div>
                      )}
                      {!currentMeal.isDateNight && (
                        <div className="absolute top-3 left-3 bg-slate-900/85 backdrop-blur px-3 py-1 rounded-full text-xs font-semibold text-emerald-300">
                          £{currentMeal.estCost.toFixed(2)} meal est.
                        </div>
                      )}
                      <div className="absolute top-3 right-3 bg-slate-900/85 backdrop-blur px-3 py-1 rounded-full text-xs font-semibold text-white">
                        ⏱ {currentMeal.prepTime} mins
                      </div>
                    </div>

                    <div className="p-5">
                      <span className={`text-xs font-bold uppercase tracking-wider ${
                        currentMeal.isDateNight ? 'text-rose-400' : 'text-emerald-400'
                      }`}>
                        {currentMeal.category}
                      </span>
                      <h2 className="text-xl font-bold text-white mt-1 mb-3">{currentMeal.name}</h2>

                      {/* FAMILY / DATE NIGHT TIP BOX */}
                      <div className={`rounded-2xl p-3.5 mb-4 border ${
                        currentMeal.isDateNight
                          ? 'bg-rose-950/50 border-rose-700/40'
                          : 'bg-slate-900/70 border-slate-700'
                      }`}>
                        <div className="text-xs font-bold text-amber-300 mb-1">
                          {currentMeal.isDateNight ? '🕯️ Date Night Plan' : '👨‍👩‍👧‍👦 Kitchen Time-Saver'}
                        </div>
                        <p className="text-xs text-slate-200 leading-relaxed">{currentMeal.familyTip}</p>
                      </div>

                      {/* ACTION BUTTONS */}
                      <div className="grid grid-cols-2 gap-3">
                        <button
                          onClick={() => handleDecision(false)}
                          className="py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-sm transition"
                        >
                          ✕ Skip
                        </button>
                        <button
                          onClick={() => handleDecision(true)}
                          className={`py-3 rounded-2xl font-bold text-sm transition ${
                            currentMeal.isDateNight
                              ? 'bg-rose-500 hover:bg-rose-400 text-white'
                              : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                          }`}
                        >
                          ✓ Add to Week
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-between items-center mt-3 px-1">
                    <p className="text-xs text-slate-500">Card {deckIndex + 1} of infinite deck</p>
                    {isAutoGenerating && (
                      <span className="text-xs text-indigo-400 font-semibold animate-pulse">✨ AI inventing next recipe...</span>
                    )}
                  </div>
                </div>
              ) : null
            )}

            {/* TAB 2: WEEK PLAN & AISLE SHOPPING LIST */}
            {activeTab === 'shop' && (
              <div className="space-y-5">
                {/* SAVED BY PACK SHARING BANNER */}
                <div className="bg-emerald-950/60 border border-emerald-700/50 rounded-2xl p-4 flex justify-between items-center">
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-300">Smart Pack Sharing</h3>
                    <p className="text-xs text-slate-300 mt-0.5">Overlapping ingredients combined into single packs</p>
                  </div>
                  <span className="text-sm font-extrabold text-emerald-300 bg-emerald-900/70 px-3 py-1 rounded-lg">
                    Saved £{savedBySharingPacks.toFixed(2)}
                  </span>
                </div>

                {/* LOCKED IN MEALS */}
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">This Week's Menu ({plannedMeals.length})</h3>
                  <div className="space-y-2">
                    {plannedMeals.map(meal => (
                      <div key={meal.id} className="flex justify-between items-center bg-slate-800/90 border border-slate-700 px-3.5 py-2.5 rounded-xl">
                        <div>
                          <span className="text-sm font-semibold text-white block">
                            {meal.isDateNight ? '🥂 ' : '🍽️ '}{meal.name}
                          </span>
                          <span className="text-[11px] text-slate-400">{meal.category}</span>
                        </div>
                        <button
                          onClick={() => setPlannedMeals(plannedMeals.filter(m => m.id !== meal.id))}
                          className="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2 py-1"
                        >
                          Remove
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* CONSOLIDATED SHOPPING LIST */}
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Consolidated Supermarket List (Tap if already in kitchen)
                  </h3>
                  <div className="space-y-2">
                    {basketItems.map(item => {
                      const checked = !!pantryChecked[item.id];
                      return (
                        <div
                          key={item.id}
                          onClick={() => togglePantryItem(item.id)}
                          className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${
                            checked
                              ? 'bg-slate-900/40 border-slate-800 opacity-50 line-through'
                              : 'bg-slate-800 border-slate-700'
                          }`}
                        >
                          <div>
                            <span className="text-sm font-medium text-white">{item.name}</span>
                            <div className="flex items-center gap-2 mt-0.5">
                              <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded">
                                {item.aisle}
                              </span>
                              {item.usedInCount > 1 && (
                                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-semibold">
                                  Shared across {item.usedInCount} meals
                                </span>
                              )}
                            </div>
                          </div>
                          <span className="text-sm font-bold text-emerald-300">£{item.price.toFixed(2)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: AI FRIDGE PHOTO SCANNER */}
            {activeTab === 'scan' && (
              <div className="space-y-4">
                <div className="bg-slate-800 border border-slate-700 rounded-3xl p-5 text-center">
                  <div className="text-4xl mb-2">📸</div>
                  <h2 className="text-lg font-bold text-white">AI Fridge & Pantry Scanner</h2>
                  <p className="text-xs text-slate-400 mt-1 mb-4">
                    Snap a photo of your fridge shelves to automatically tick off packs you already own and deduct them from your shop total.
                  </p>

                  <label className="block w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm rounded-2xl cursor-pointer transition">
                    📷 Take or Upload Fridge Photo
                    <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                  </label>
                </div>

                {scanMessage && (
                  <div className="bg-emerald-950/80 border border-emerald-500/40 rounded-2xl p-4 text-xs text-emerald-200 font-medium">
                    ✅ {scanMessage}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur border-t border-slate-800 grid grid-cols-3 p-2 z-20">
            <button
              onClick={() => setActiveTab('swipe')}
              className={`py-2.5 rounded-xl text-xs font-bold transition ${
                activeTab === 'swipe' ? 'text-emerald-400 bg-slate-800' : 'text-slate-400'
              }`}
            >
              🔥 Swipe Deck
            </button>
            <button
              onClick={() => setActiveTab('shop')}
              className={`py-2.5 rounded-xl text-xs font-bold transition ${
                activeTab === 'shop' ? 'text-emerald-400 bg-slate-800' : 'text-slate-400'
              }`}
            >
              🛒 Shop ({basketItems.length})
            </button>
            <button
              onClick={() => setActiveTab('scan')}
              className={`py-2.5 rounded-xl text-xs font-bold transition ${
                activeTab === 'scan' ? 'text-emerald-400 bg-slate-800' : 'text-slate-400'
              }`}
            >
              📸 AI Fridge
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
