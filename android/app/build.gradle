apply plugin: 'com.android.application'

def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('keystore.properties')
def hasUploadSigning = uploadPropertiesFile.isFile()
if (hasUploadSigning) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { field ->
        if (!uploadProperties.getProperty(field)?.trim()) {
            throw new GradleException('Android upload signing configuration is incomplete: ' + field)
        }
    }
    if (!rootProject.file(uploadProperties.getProperty('storeFile')).isFile()) {
        throw new GradleException('Android upload keystore was not found. Run android-signing.mjs with your private key.')
    }
}

android {
    namespace = "uk.co.basketboss.app"
    compileSdk = rootProject.ext.compileSdkVersion
    assetPacks = [":recipeImages"]
    defaultConfig {
        applicationId "uk.co.basketboss.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.0.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile rootProject.file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Ordinary release builds must never silently produce an unsigned upload.
// CI can explicitly compile an UNSIGNED test artefact without any private key.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    def unsignedTest = project.findProperty('bbAllowUnsignedTestBuild') == 'true'
    if (releaseRequested && !hasUploadSigning && !unsignedTest) {
        throw new GradleException('Release signing is required. Configure android/keystore.properties using your private upload key.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
