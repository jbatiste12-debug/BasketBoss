name: Check Cloudflare catalogue connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-catalogue-check.yml
      - scripts/check-cloudflare-catalogue.mjs
      - bb-food-visuals.*
      - bb-cook-studio.*
      - bb-cook-result.*
      - bb-meal-image.*
      - bb-navigation-polish.*
      - bb-account-polish.*
      - bb-auth-*
      - bb-dietary-preferences.js
      - bb-meal-preferences.*
      - bb-tab-swipe.js
      - bb-tab-viewport.*
      - bb-home.js
      - bb-shared-shopping.*
      - bb-kitchen-*
      - bb-simple-layout.*
      - bb-weekly-shop.*
      - bb-weekly-essentials.*
      - bb-plan-premium-polish.*
      - bb-real-app-tour-v82.js
      - tutorial.html
      - basketboss-latest-guide.html
      - bb-onboarding-v2.*
      - index.html
      - app.html
      - service-worker.js
      - food-thumbs/v2/**
      - shopping-inventory.js
      - make-a-meal.*
      - functions/privacy.js
      - functions/terms.js
      - privacy.html
      - terms.html
      - bb-server-lib/bb-public-legal.js
      - bb-server-lib/bb-account-deletion.js
      - functions/api/account/**
      - sql/basketboss_account_deletion_20261031.sql
      - functions/api/subscription/**
      - functions/api/receipt-inventory.js
      - functions/api/bb173/**
      - bb-server-lib/bb-receipt-canonical-pairs.js
      - bb-server-lib/bb-request-origin.js
      - functions/api/_middleware.js
      - welcome.html
      - bb-family-landing.css
      - bb-family-landing.js
      - bb-smart-receipt-landing.css
      - bb-beta-landing.js
      - functions/index.js

permissions:
  contents: read

jobs:
  deployment-status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current Pages deployment without waiting for propagation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {inspectCloudflare} from './scripts/check-cloudflare-catalogue.mjs';
          const {project, branch, latestDeployment, productionCommit, diagnosedFailure, buildFailureCategories}=await inspectCloudflare(process.env);
          console.log('::notice title=BasketBoss deployment status::'+JSON.stringify({project,branch,latestDeployment,productionCommit,diagnosedFailure,buildFailureCategories}));
          JS

  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect production deployment and catalogue counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-catalogue.mjs

  readonly_recipe_audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/recipe-editorial-collections'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read and seal the private catalogue for review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RECIPE_AUDIT_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/recipe-audit-ci.mjs
      - name: Remove private plaintext even after a failed read
        if: always()
        run: node scripts/recipe-audit-ci.mjs --cleanup
      - name: Retain only the encrypted recipe-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-recipe-audit-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/basketboss-recipe-audit.sealed.json
          if-no-files-found: ignore
          retention-days: 1
