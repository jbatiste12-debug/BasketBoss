name: Verify iOS native build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-cook-fix, release/recipe-editorial-collections]
    paths:
      - .github/workflows/ios-native-build.yml
      - capacitor.config.json
      - package.json
      - package-lock.json
      - index.html
      - app.html
      - bb-account-deletion.*
      - bb-food-visuals.*
      - bb-ingredient-*
      - bb-evening-*
      - bb-cook-voice.*
      - bb-cook-speech-text.js
      - bb-cook-tts.js
      - bb-cook-experience.css
      - bb-cook-clarity.css
      - bb-cook-pantry.js
      - bb-cook-step-layout.js
      - bb-duration.js
      - bb-featured-framing.js
      - bb-how-it-works.*
      - bb-pantry-camera.*
      - bb-pantry-deduction.js
      - bb-receipt-quantity.js
      - bb-recipe-measures.js
      - bb-cook-studio.*
      - bb-cook-result.*
      - bb-meal-image.*
      - bb-navigation-polish.*
      - bb-account-polish.*
      - bb-home.js
      - bb-shared-shopping.*
      - bb-kitchen-*
      - bb-simple-layout.*
      - bb-weekly-shop.*
      - bb-weekly-essentials.*
      - bb-plan-premium-polish.*
      - bb-real-app-tour-v82.js
      - tutorial.html
      - basketboss-latest-guide.html
      - food-thumbs/v2/**
      - shopping-inventory.js
      - release-assets/basketboss-v17/images/**
      - make-a-meal.*
      - bb-onboarding-v2.*
      - tests/basketboss-native-*.test.mjs
      - native/**
      - ios/**
      - scripts/*native*.mjs
      - scripts/*ios*.mjs

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned native dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and sync iOS workspace
        run: npm run ios:sync
      - name: Test native routing and permissions
        run: npm run test:native
      - name: Compile the iOS simulator app without signing credentials
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/basketboss-ios-build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Publish fixed build verification
        run: echo '::notice title=BasketBoss iOS native build::{"simulatorBuild":true,"bundleId":"uk.co.basketboss.app","minimumIOS":"16.0","signingTested":false}'
      - name: Exercise Cook in the actual iOS WebView
        run: node scripts/test-ios-cook-smoke.mjs
      - name: Check account inputs with the real iOS keyboard
        if: ${{ !cancelled() }}
        run: node scripts/test-ios-account-keyboard.mjs
      - name: Create the unsigned iPhone archive for build 4
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/basketboss-ios-device-build \
            -archivePath "$RUNNER_TEMP/BasketBoss-1.0-build4.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/BasketBoss-1.0-build4.xcarchive/Products/Applications/App.app/Info.plist")" = '4'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/BasketBoss-1.0-build4.xcarchive/Products/Applications/App.app/Info.plist")" = 'uk.co.basketboss.app'
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/BasketBoss-1.0-build4.xcarchive" \
            "$RUNNER_TEMP/BasketBoss-1.0-build4-unsigned.xcarchive.zip"
      - name: Retain the unsigned iPhone archive
        uses: actions/upload-artifact@v6
        with:
          name: BasketBoss-1.0-build4-unsigned-iPhone-archive
          path: ${{ runner.temp }}/BasketBoss-1.0-build4-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: BasketBoss-Account-Keyboard-Verification
          path: artifacts/account-keyboard-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
