name: Verify BasketBoss Apple subscriptions
on:
  push:
    branches: [main, codex/apple-*, codex/ingredient-*, codex/evening-*, codex/ios-signin-*]
    paths:
      - .github/workflows/apple-subscriptions.yml
      - ios/**
      - native/**
      - bb-server-lib/**
      - functions/api/**
      - scripts/*native*
      - scripts/*ios*
      - scripts/*apple*
      - sql/*apple*
      - tests/**
      - package.json
      - package-lock.json
      - bb-account-deletion.js
      - bb-account-polish.*
      - bb-home.js
      - bb-shared-shopping.*
      - bb-kitchen-*
      - bb-simple-layout.*
      - bb-weekly-shop.*
      - bb-weekly-essentials.*
      - bb-membership-settings.js
      - bb-ingredient-*
      - bb-evening-*
      - bb-cook-voice.*
      - index.html
      - app.html
      - privacy.html
      - terms.html
      - subscriptions.html
      - service-worker.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: basketboss-apple-subscriptions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          native=true
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            native=false
            while IFS= read -r file; do
              if [[ "$file" == ".github/workflows/apple-subscriptions.yml" || "$file" =~ ^(ios/|native/|scripts/(build-native|ios-|test-ios|prepare-ios|verify-ios-storekit-release)|capacitor\.config\.(ts|js|json)$|package(-lock)?\.json$|[^/]+\.(js|mjs|css|html)$) ]]; then
                native=true
              fi
            done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
  portable-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:native
      - run: npm run ios:verify
      - name: Native routing and purchase controller tests
        run: npm run test:native
      - name: Audit product IDs and simulate the full client purchase flow
        run: node scripts/verify-apple-purchase-flow.mjs --output artifacts/apple-purchase-local-diagnostic.json
      - name: Read production Apple configuration without account credentials
        run: |
          node --input-type=module <<'JS'
          const expected=['uk.co.basketboss.premium.monthly','uk.co.basketboss.premium.annual'];
          let report={available:false,transport:'unavailable',realPurchaseTested:false};
          try {
            const response=await fetch('https://basketboss.co.uk/api/apple/config',{headers:{Origin:'capacitor://localhost'},signal:AbortSignal.timeout(15000),redirect:'error'});
            const body=await response.json();
            report={available:body.available===true,httpStatus:response.status,environment:['Production','Sandbox'].includes(body.environment)?body.environment:null,
              reason:['apple_not_enabled','apple_not_ready'].includes(body.reason)?body.reason:null,
              productIdsMatch:Array.isArray(body.productIds)&&body.productIds.length===2&&expected.every(id=>body.productIds.includes(id)),realPurchaseTested:false};
          } catch {}
          console.log('::notice title=Apple production purchase configuration::'+JSON.stringify(report));
          JS
      - uses: actions/upload-artifact@v6
        with:
          name: BasketBoss-Apple-Portable-Diagnostic
          path: artifacts/apple-purchase-local-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/bb-apple-pg" --package-lock=false --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify Apple, web billing, household and account regression suites
        env:
          BB_PGLITE_MODULE: ${{ runner.temp }}/bb-apple-pg/node_modules/@electric-sql/pglite
          BB_RECEIPT_PGLITE_PATH: ${{ runner.temp }}/bb-apple-pg/node_modules/@electric-sql/pglite/dist/index.js
        # Full sequential browser coverage stays in web700-regression.yml.
        # This job deliberately installs only the portable PostgreSQL tools.
        run: >-
          node --test --test-concurrency=1
          tests/basketboss-apple*.test.mjs
          tests/basketboss-native*.test.mjs
          tests/basketboss-account-deletion*.test.mjs
          tests/basketboss-premium-billing*.test.mjs
          tests/basketboss-premium-ai-checkout-reconcile.test.mjs
          tests/basketboss-testflight-beta*.test.mjs
          tests/basketboss-public-legal.test.mjs
          tests/basketboss-household-amount*.test.mjs
          tests/basketboss-household-production.test.mjs
          tests/basketboss-household-quantities.test.mjs
          tests/basketboss-household-readable-quantities.test.mjs
          tests/basketboss-household-readiness.test.mjs
          tests/basketboss-household-routing.test.mjs
          tests/basketboss-shared-shopping*.test.mjs
      - name: Install isolated Cloudflare runtime verification tools
        run: npm install --prefix "$RUNNER_TEMP/bb-apple-worker" --package-lock=false --ignore-scripts --no-audit --no-fund wrangler@4.156.0
      - name: Verify cold Worker startup and real signature verification
        env:
          BB_WORKER_TEST_TOOLS: ${{ runner.temp }}/bb-apple-worker/node_modules
        run: node scripts/test-apple-worker.mjs
  local-storekit-simulator:
    needs: changed-files
    if: needs.changed-files.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and sync native workspace
        run: npm run ios:sync
      - name: Compile Debug iPhone simulator app
        run: >-
          xcodebuild
          -quiet
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/basketboss-ios-build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile Release without local StoreKit test code
        run: >-
          xcodebuild
          -quiet
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/basketboss-ios-build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify Release excludes StoreKit test fixture
        run: node scripts/verify-ios-storekit-release.mjs --app /tmp/basketboss-ios-build/Build/Products/Release-iphonesimulator/App.app
      - name: Exercise real StoreKit bridge in hosted XCTest with local products
        env:
          BB_IAP_KEEP_SIMULATOR_BOOTED: 'true'
        run: node scripts/test-ios-iap-smoke.mjs
      - name: Keep existing Cook navigation working
        if: ${{ !cancelled() }}
        run: node scripts/test-ios-cook-smoke.mjs
      - name: Check account inputs with the real iOS keyboard
        if: ${{ !cancelled() }}
        run: node scripts/test-ios-account-keyboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BasketBoss-Local-StoreKit-Verification
          path: artifacts/apple-iap-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BasketBoss-Account-Keyboard-Verification
          path: artifacts/account-keyboard-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
