name: Read-only ingredient and unit audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ingredient-unit-audit.yml
      - scripts/audit-ingredient-units.mjs
      - scripts/audit-private-ingredient-units-ci.mjs

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/basketboss-ingredient-unit-audit.test.mjs
  audit:
    needs: portable
    if: github.repository == 'jbatiste12-debug/BasketBoss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Read production ingredients and aggregate units only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-private-ingredient-units-ci.mjs
      - name: Retain aggregate ingredient audit without recipe content
        uses: actions/upload-artifact@v4
        with:
          name: basketboss-ingredient-unit-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/basketboss-ingredient-unit-audit.json
          if-no-files-found: error
          retention-days: 1
