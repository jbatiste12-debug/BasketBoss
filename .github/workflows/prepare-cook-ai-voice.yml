name: Prepare Cook AI voice service

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-cook-ai-voice.yml
      - scripts/prepare-cook-ai-voice.mjs
      - tests/basketboss-prepare-cook-ai-voice.test.mjs
      - tests/basketboss-tts.test.mjs
      - functions/api/tts.js
      - functions/api/_middleware.js
      - bb-server-lib/bb-tts.js
      - sql/basketboss_cook_tts_20261102.sql
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect readiness or prepare the reviewed additive TTS schema
        type: choice
        options: [inspect, prepare]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: basketboss-cook-ai-voice-prepare
  cancel-in-progress: false

jobs:
  portable:
    if: github.repository == 'jbatiste12-debug/BasketBoss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify TTS, native transport, membership and schema preparation
        run: node --test --test-isolation=none tests/basketboss-tts.test.mjs tests/basketboss-native-api-origin.test.mjs tests/basketboss-premium-session-route-regression.test.mjs tests/basketboss-prepare-cook-ai-voice.test.mjs
  prepare:
    needs: portable
    if: github.repository == 'jbatiste12-debug/BasketBoss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pinned atomic D1 importer outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/basketboss-tts-tools" --no-audit --no-fund --save-exact wrangler@4.156.0
      - name: Verify production bindings and prepare only the reviewed TTS schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BB_TTS_PREPARE_MODE: ${{ github.event_name == 'push' && 'prepare' || inputs.mode }}
          WRANGLER_BIN: ${{ runner.temp }}/basketboss-tts-tools/node_modules/.bin/wrangler
        run: node scripts/prepare-cook-ai-voice.mjs
