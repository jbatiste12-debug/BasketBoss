name: Prepare Apple billing with purchases disabled

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-apple-billing.yml
      - scripts/prepare-apple-billing.mjs
      - sql/basketboss_apple_subscriptions_20261101.sql
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect configuration or prepare the additive Apple schema
        type: choice
        options: [inspect, prepare]
        default: inspect
        required: true

permissions:
  contents: read

concurrency:
  group: basketboss-apple-billing-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned atomic D1 importer outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/basketboss-apple-tools" --no-audit --no-fund --save-exact wrangler@4.156.0
      - name: Verify production configuration, preserve web billing and prepare Apple tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BB_APPLE_PREPARE_MODE: ${{ github.event_name == 'push' && 'prepare' || inputs.mode }}
          WRANGLER_BIN: ${{ runner.temp }}/basketboss-apple-tools/node_modules/.bin/wrangler
        run: node scripts/prepare-apple-billing.mjs
