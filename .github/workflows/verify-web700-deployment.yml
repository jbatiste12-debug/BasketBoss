name: Verify public web 700 deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-web700-deployment.yml
      - release-assets/prepare-build43-mac.command
      - release-assets/build43-README.txt
      - bb-account-pantry-live.js
      - bb-account-polish.js
      - bb-account-polish.css
      - shopping-inventory.js
      - bb-household-sharing.js
      - scripts/verify-web700-deployment.mjs
      - scripts/verify-layout-deployment.mjs
      - bb-simple-layout.js
      - bb-pantry-inline.js
      - bb-pantry-inline.css
      - bb-plan-premium-polish.css
      - bb-premium-finish.css
      - bb-shop-ownership.js
      - bb-shop-continuation.js
      - bb-shop-continuation.css
      - bb-receipt-host.js
      - bb-receipt-inventory.js
      - bb-home.js
      - bb-shop-purchase-ui.js
      - bb-shop-purchase-ui.css
      - bb-shared-shopping.js
      - bb-household-stock-review.js
      - bb-loose-produce-ui.js
      - bb-day-done.js
      - bb-cook-pantry.js
      - bb-kitchen-choice-rules.mjs
      - bb-kitchen-essentials.js
      - bb-shop-add.js
      - tests/basketboss-web700-deployment.test.mjs
      - tests/basketboss-layout-deployment.test.mjs
      - tests/basketboss-shop-restock-deployment.test.mjs
      - pwa700/**

permissions:
  contents: read

jobs:
  public-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify bounded public diagnostics and unchanged acceptance rules
        run: node --test tests/basketboss-web700-deployment.test.mjs tests/basketboss-layout-deployment.test.mjs tests/basketboss-shop-restock-deployment.test.mjs
      - name: Verify public assets and both anonymous Premium boundaries
        run: node scripts/verify-web700-deployment.mjs --once
      - name: Verify the current planner, pantry and shopping layouts
        run: node scripts/verify-layout-deployment.mjs --shop-restock
      - name: Verify the current buying controls and shared-list display bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const assets=['bb-shop-purchase-ui.js','bb-shop-purchase-ui.css','bb-shared-shopping.js','bb-household-stock-review.js','bb-loose-produce-ui.js','bb-day-done.js','bb-cook-pantry.js','bb-pantry-inline.js','bb-kitchen-choice-rules.mjs','bb-kitchen-essentials.js','bb-shop-add.js','bb-premium-features.js','bb-household-amount.js','bb-essentials-confirm.js','bb-recipe-measures.js','bb-us-market.js','bb-cook-result.js','bb-kitchen-prices.js','bb-price-scan.js','service-worker.js','bb-pantry-first-controls.js','bb-pantry-first-controls.css','bb-pantry-autofill.js','bb-account-pantry-live.js','bb-account-polish.js','bb-account-polish.css','shopping-inventory.js','bb-household-sharing.js'];
          const generated=new Set(JSON.parse(fs.readFileSync('pwa700/manifest.json','utf8')).files.map(row=>row.path));
          const paths=assets.flatMap(name=>generated.has(name)?[name,'pwa700/'+name]:[name]);
          for(const name of paths){
            const expected=fs.readFileSync(name);
            const response=await fetch('https://basketboss.co.uk/'+name,{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(15000)});
            assert.equal(response.status,200,'Buying control asset unavailable');
            assert.match(response.headers.get('content-type')||'',name.endsWith('.css')?/text\/css/i:/javascript/i);
            const reader=response.body.getReader(),parts=[];let length=0;
            try{for(;;){const {done,value}=await reader.read();if(done)break;length+=value.length;assert.ok(length<=1024*1024,'Buying control asset too large');parts.push(Buffer.from(value));}}
            finally{await reader.cancel().catch(()=>{});}
            assert.ok(Buffer.concat(parts).equals(expected),'Buying control asset stale: '+name);
          }
          console.log(JSON.stringify({ok:true,buyingControlAssetsVerified:assets.length,releaseAssetRoutesVerified:paths.length}));
          JS
