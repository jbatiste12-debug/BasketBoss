name: Record BasketBoss App Store preview
on:
  push:
    branches: [codex/app-store-preview-20261101]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and sync latest main native app
        run: npm run ios:sync
      - name: Install capture-only Debug instrumentation
        run: node scripts/prepare-screenshot-build.mjs
      - name: Build iPhone simulator app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/basketboss-ios-build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install video encoder
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Record real iPhone footage and export App Preview
        run: node scripts/capture-app-store-preview.mjs
      - name: Upload App Store preview video
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: BasketBoss-App-Store-Preview-27-seconds
          path: artifacts/app-store-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Upload recording diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BasketBoss-preview-diagnostics
          path: artifacts/capture-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link downloadable video
        run: echo 'App Store preview — ${{ steps.preview.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"
