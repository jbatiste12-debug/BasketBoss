name: Verify App Store compliance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-store-compliance.yml
      - bb-account-deletion.*
      - bb-food-visuals.*
      - bb-ingredient-*
      - bb-evening-*
      - bb-cook-voice.*
      - bb-cook-studio.*
      - bb-cook-result.*
      - bb-meal-image.*
      - bb-navigation-polish.*
      - bb-account-polish.*
      - bb-home.js
      - bb-shared-shopping.*
      - bb-kitchen-*
      - bb-yellow-stickers*
      - bb-reduced-*
      - supabase/migrations/**
      - bb-simple-layout.*
      - bb-weekly-shop.*
      - bb-weekly-essentials.*
      - food-thumbs/v2/**
      - shopping-inventory.js
      - make-a-meal.*
      - bb-onboarding-v2.*
      - bb-server-lib/**
      - functions/**
      - sql/**
      - native/**
      - index.html
      - app.html
      - privacy.html
      - terms.html
      - service-worker.js
      - tests/**
      - scripts/verify-apple-purchase-flow.mjs

permissions:
  contents: read

jobs:
  compliance:
    # Main full suites share one slot; never overlap Chromium runners per ref.
    concurrency:
      group: basketboss-full-regression-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure isolated full-suite tools
        run: |
          printf '%s\n' \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/bb-deletion-pg-chromium" \
            "BB_PLAYWRIGHT_MODULE=$RUNNER_TEMP/bb-deletion-pg/node_modules/playwright" \
            "BB_PGLITE_MODULE=$RUNNER_TEMP/bb-deletion-pg/node_modules/@electric-sql/pglite" \
            "BB_RECEIPT_PGLITE_PATH=$RUNNER_TEMP/bb-deletion-pg/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Install pinned browser and PostgreSQL test engines
        run: >-
          npm install --prefix "$RUNNER_TEMP/bb-deletion-pg"
          --package-lock=false --ignore-scripts --no-audit --no-fund
          playwright@1.62.1 @electric-sql/pglite@0.3.14
      - name: Install the matching Chromium runtime
        run: node "$BB_PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
      - name: Require the browser and PostgreSQL test engines
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const {chromium} = require(process.env.BB_PLAYWRIGHT_MODULE);
          const {PGlite} = require(process.env.BB_PGLITE_MODULE);
          assert.equal(typeof chromium.launch, 'function');
          assert.equal(typeof PGlite, 'function');
          require('node:fs').accessSync(chromium.executablePath());
          console.log('Pinned browser and PostgreSQL test engines are available.');
          JS
      - run: npm run build:native
      - name: Verify account deletion, SQL permissions and native billing boundaries
        env:
          BB_PGLITE_MODULE: ${{ runner.temp }}/bb-deletion-pg/node_modules/@electric-sql/pglite
          BB_RECEIPT_PGLITE_PATH: ${{ runner.temp }}/bb-deletion-pg/node_modules/@electric-sql/pglite/dist/index.js
        # Execute every assertion, including mandatory browser and historical SQL audits.
        # web700-regression.yml provides the same full coverage for review/manual runs.
        run: node --test --test-concurrency=1 tests/*.test.mjs
