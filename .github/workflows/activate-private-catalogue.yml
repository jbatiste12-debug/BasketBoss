name: Activate private 500-recipe catalogue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the release or activate the approved private catalogue
        type: choice
        options: [inspect, activate]
        default: inspect
        required: true
  push:
    branches: [main]
    paths:
      - .github/private-catalogue/recipes-500.sealed.json

permissions:
  contents: read

concurrency:
  group: basketboss-private-catalogue-500
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the reviewed atomic D1 importer outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/basketboss-tools" --no-audit --no-fund --save-exact wrangler@4.156.0
      - name: Validate, preserve legacy records and activate the sealed catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BB_IMPORT_MODE: ${{ github.event_name == 'push' && 'activate' || inputs.mode }}
          WRANGLER_BIN: ${{ runner.temp }}/basketboss-tools/node_modules/.bin/wrangler
        run: node scripts/activate-private-catalogue.mjs
      - name: Retain only the encrypted rollback snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-catalogue-rollback-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/basketboss-catalogue-rollback.sealed.json
          if-no-files-found: ignore
          retention-days: 7
